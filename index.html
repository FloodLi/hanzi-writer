<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汉字笔顺 · 田字格</title>
<style>
  /* 为 Kindle 电子墨水屏设计：纯黑白、高对比、无动画、大按钮 */
  html, body { margin: 0; padding: 0; background: #fff; color: #000;
    font-family: "Songti SC", SimSun, serif; }
  #wrap { width: 580px; margin: 0 auto; padding: 4px 0; text-align: center; }
  #bar input { font-size: 26px; width: 4em; padding: 4px; text-align: center;
    border: 2px solid #000; background: #fff; }
  button { font-size: 22px; padding: 6px 12px; margin: 3px 2px; background: #fff;
    color: #000; border: 2px solid #000; border-radius: 6px; }
  button.on { background: #000; color: #fff; }
  #board { width: 400px; height: 400px; margin: 6px auto; border: 2px solid #000; }
  #board canvas { display: block; }
  #info { font-size: 20px; margin: 2px 0; height: 1.4em; overflow: hidden; }
  #chars { margin: 2px 0; }
  #steps { margin-top: 6px; text-align: left; font-size: 0; }
  .step { display: inline-block; width: 90px; height: 90px; margin: 3px 4px;
    border: 1px solid #000; vertical-align: top; }
  .step canvas { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <input id="txt" type="text" value="" maxlength="8">
    <button id="go">显示</button>
  </div>
  <div id="chars"></div>
  <div id="board"><canvas id="cv" width="396" height="396"></canvas></div>
  <div id="info"></div>
  <div id="ctl">
    <button id="prev">上一笔</button>
    <button id="next">下一笔</button>
    <button id="all">全部</button>
    <button id="reset">重来</button>
    <button id="play">自动播放</button>
    <button id="outline">描红：开</button>
  </div>
  <div id="steps"></div>
</div>

<script>
(function () {
  // 笔画数据来自 hanzi-writer-data（与 hanzi-writer 项目同源），仅用 ES5 以兼容 Kindle 浏览器
  var CDN = [
    "https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/",
    "https://unpkg.com/hanzi-writer-data@2.0.1/"
  ];
  var cache = {}, data = null, step = 0, timer = null, showOutline = true;
  var chars = [], cur = 0, startPlayRef = null;

  function $(id) { return document.getElementById(id); }

  function load(ch, cb, i) {
    i = i || 0;
    if (cache[ch]) { cb(cache[ch]); return; }
    if (i >= CDN.length) { cb(null); return; }
    var x = new XMLHttpRequest();
    x.open("GET", CDN[i] + encodeURIComponent(ch) + ".json", true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status === 200) {
        try { cache[ch] = JSON.parse(x.responseText); cb(cache[ch]); return; } catch (e) {}
      }
      load(ch, cb, i + 1);
    };
    x.send();
  }

  // 不用内联 SVG：Kindle 旧版浏览器不支持 HTML 里的内联 SVG，改用 canvas 绘制
  function parsePath(d) {
    var t = d.match(/[MLQCZ]|-?\d*\.?\d+/g) || [], out = [], i = 0, c;
    while (i < t.length) {
      c = t[i++];
      if (c === "Z") { out.push(["Z"]); continue; }
      var n = c === "Q" ? 4 : c === "C" ? 6 : 2, a = [c], k;
      for (k = 0; k < n; k++) a.push(parseFloat(t[i++]));
      out.push(a);
    }
    return out;
  }

  function tracePath(ctx, cmds) {
    var i, c;
    ctx.beginPath();
    for (i = 0; i < cmds.length; i++) {
      c = cmds[i];
      if (c[0] === "M") ctx.moveTo(c[1], c[2]);
      else if (c[0] === "L") ctx.lineTo(c[1], c[2]);
      else if (c[0] === "Q") ctx.quadraticCurveTo(c[1], c[2], c[3], c[4]);
      else if (c[0] === "C") ctx.bezierCurveTo(c[1], c[2], c[3], c[4], c[5], c[6]);
      else ctx.closePath();
    }
  }

  // 手绘虚线（旧浏览器没有 setLineDash）
  function dashed(ctx, x1, y1, x2, y2, on, off) {
    var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy);
    var ux = dx / len, uy = dy / len, p = 0;
    ctx.beginPath();
    while (p < len) {
      var e = Math.min(p + on, len);
      ctx.moveTo(x1 + ux * p, y1 + uy * p);
      ctx.lineTo(x1 + ux * e, y1 + uy * e);
      p += on + off;
    }
    ctx.stroke();
  }

  // 在 canvas 上画田字格（0..100 坐标）及笔画
  function draw(cv, size, small, upto, outlineRest) {
    var ctx = cv.getContext("2d"), k = size / 100, i;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, size, size);
    ctx.scale(k, k);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = small ? 2 : 3;
    ctx.strokeRect(1, 1, 98, 98);
    ctx.lineWidth = small ? 1 : 1.2;
    dashed(ctx, 50, 1, 50, 99, 4, 3);
    dashed(ctx, 1, 50, 99, 50, 4, 3);
    ctx.strokeStyle = "#999";
    dashed(ctx, 1, 1, 99, 99, 2, 4);
    dashed(ctx, 99, 1, 1, 99, 2, 4);
    if (!data) return;
    // 汉字坐标 1024，y 轴翻转；缩放到 100 内并留边
    ctx.translate(6, 92);
    ctx.scale(0.088, -0.088);
    ctx.translate(0, 124);
    var p = data.paths, n = p.length;
    if (outlineRest) {
      ctx.fillStyle = "#ddd";
      for (i = upto; i < n; i++) { tracePath(ctx, p[i]); ctx.fill(); }
    }
    for (i = 0; i < upto && i < n; i++) {
      var hl = i === upto - 1;
      ctx.fillStyle = hl ? "#000" : "#555";
      tracePath(ctx, p[i]);
      ctx.fill();
      if (hl) { ctx.strokeStyle = "#000"; ctx.lineWidth = 30; ctx.stroke(); }
    }
  }

  function render() {
    if (!data) return;
    draw($("cv"), 396, false, step, showOutline);
    $("info").innerHTML = chars[cur] + "　第 " + step + " / " + data.paths.length + " 笔";
  }

  function buildSteps() {
    var n = data.paths.length, box = $("steps"), i;
    box.innerHTML = "";
    for (i = 1; i <= n; i++) {
      var d = document.createElement("div"), cv = document.createElement("canvas");
      d.className = "step";
      cv.width = 88; cv.height = 88;
      d.appendChild(cv); box.appendChild(d);
      draw(cv, 88, true, i, false);
    }
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    $("play").innerHTML = "自动播放";
    $("play").className = "";
  }

  function show(idx) {
    stop();
    cur = idx;
    var h = "", i;
    for (i = 0; i < chars.length; i++)
      h += '<button data-i="' + i + '"' + (i === idx ? ' class="on"' : '') + '>' + chars[i] + '</button>';
    $("chars").innerHTML = chars.length > 1 ? h : "";
    $("info").innerHTML = "加载中…";
    load(chars[idx], function (d) {
      if (cur !== idx) return;
      if (!d) {
        data = null;
        draw($("cv"), 396, false, 0, false);
        $("info").innerHTML = "没有找到「" + chars[idx] + "」的笔画数据（或网络不通）";
        $("steps").innerHTML = "";
        return;
      }
      d.paths = d.paths || [];
      if (!d.paths.length) for (var j = 0; j < d.strokes.length; j++) d.paths.push(parsePath(d.strokes[j]));
      data = d; step = 0;
      render(); buildSteps();
      if (startPlayRef) startPlayRef();
    });
  }

  function go() {
    var v = $("txt").value, a = [], i;
    for (i = 0; i < v.length; i++) {
      var c = v.charAt(i);
      if (/[一-鿿]/.test(c)) a.push(c);
    }
    // 处理可能的代理对（生僻字）
    if (!a.length) { $("info").innerHTML = "请输入汉字"; return; }
    chars = a; show(0);
  }

  $("go").onclick = go;
  $("txt").onkeydown = function (e) { if ((e.keyCode || e.which) === 13) go(); };
  $("chars").onclick = function (e) {
    var t = e.target || e.srcElement;
    if (t && t.getAttribute && t.getAttribute("data-i") !== null)
      show(parseInt(t.getAttribute("data-i"), 10));
  };
  $("next").onclick = function () {
    if (data && step < data.paths.length) { step++; render(); }
  };
  $("prev").onclick = function () { if (data && step > 0) { step--; render(); } };
  $("all").onclick = function () { stop(); if (data) { step = data.paths.length; render(); } };
  $("reset").onclick = function () { stop(); step = 0; render(); };
  $("outline").onclick = function () {
    showOutline = !showOutline;
    $("outline").innerHTML = "描红：" + (showOutline ? "开" : "关");
    render();
  };
  // 电子墨水屏刷新慢：自动播放每笔间隔 1.5 秒，写完停顿 3 秒后循环，不做连续动画
  function startPlay() {
    if (!data) return;
    stop();
    var hold = 0;
    if (step >= data.paths.length) step = 0;
    $("play").innerHTML = "暂停";
    $("play").className = "on";
    render();
    timer = setInterval(function () {
      if (step >= data.paths.length) {
        // 写完后停顿 3 秒（2 个间隔），再从头重复播放
        hold++;
        if (hold >= 2) { hold = 0; step = 0; render(); }
        return;
      }
      step++; render();
    }, 1500);
  }
  $("play").onclick = function () { if (timer) stop(); else startPlay(); };
  startPlayRef = startPlay;

  $("info").innerHTML = "请输入汉字，再点“显示”";
  draw($("cv"), 396, false, 0, false);
})();
</script>
</body>
</html>
